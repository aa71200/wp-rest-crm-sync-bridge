name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none
      - run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l
      - run: php tests/check.php
  php-quality:
    uses: aa71200/aa71200/.github/workflows/php-quality.yml@main
    with:
      harness_ref: main
